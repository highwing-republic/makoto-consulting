name: Update inbound accommodation data

on:
  schedule:
    - cron: "17 21 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-inbound-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Fetch and validate latest second preliminary data
        run: python scripts/update_inbound_data.py

      - name: Run tests
        run: pytest -q

      - name: Commit updated JSON
        run: |
          if git diff --quiet -- data/inbound/latest.json data/inbound/metadata.json; then
            echo "No new second preliminary data."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/inbound/latest.json data/inbound/metadata.json
          git commit -m "Update inbound accommodation statistics"
          git push
