name: Sync tourism market signal

on:
  schedule:
    # Every 20 minutes, Mon-Fri 05:00-10:59 JST. GitHub cron is UTC:
    # Sun-Thu 20:00-23:59 UTC = Mon-Fri 05:00-08:59 JST
    - cron: "7,27,47 20-23 * * 0-4"
    # Mon-Fri 00:00-01:59 UTC = Mon-Fri 09:00-10:59 JST
    - cron: "7,27,47 0-1 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-tourism-signal
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout tourism market signal report
        uses: actions/checkout@v4
        with:
          repository: highwing-republic/tourism-market-signal
          path: .signal-source
          sparse-checkout: docs
          persist-credentials: false

      - name: Copy report into the lab site
        run: |
          rsync -a --delete --exclude .nojekyll .signal-source/docs/ tourism-market-signal/
          rm -rf .signal-source

      - name: Apply compact Lab report presentation
        run: python3 scripts/prepare_signal_report.py

      - name: Commit and push when the report changed
        id: commit
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- tourism-market-signal)" ]; then
            echo "No report changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tourism-market-signal
          git commit -m "Sync tourism market signal report"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 10
          done
          exit 1

  publish:
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
    steps:
      # GITHUB_TOKEN pushes do not trigger a Pages build automatically.
      - name: Publish the synced report
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
