<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>銘柄詳細｜EDINET投資レーダー</title><script src="https://unpkg.com/lightweight-charts@5.0.9/dist/lightweight-charts.standalone.production.js"></script><style>
:root{--ink:#172033;--muted:#687386;--line:#e3e8ef;--bg:#f4f6f9;--navy:#142a45;--blue:#2563eb;--green:#16805b;--red:#dc3545}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}.shell{width:min(1120px,calc(100% - 28px));margin:auto}.top{background:var(--navy);color:#fff;padding:26px 0}.back{color:#bad3f2;text-decoration:none;font-size:13px}.top h1{margin:15px 0 3px;font-size:clamp(25px,5vw,38px)}.sub{color:#ccd7e5;margin:0}.main{padding:22px 0 60px}.notice,.panel,.metric{background:#fff;border:1px solid var(--line);border-radius:14px}.notice{display:none;padding:20px}.summary{display:grid;grid-template-columns:1.25fr repeat(4,1fr);gap:12px}.metric{padding:17px}.metric span{display:block;font-size:12px;color:var(--muted)}.metric strong{display:block;margin-top:7px;font-size:21px}.signal strong{font-size:32px;color:var(--blue)}.panel{padding:18px;margin-top:16px}.toolbar{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.buttons{display:flex;gap:6px;flex-wrap:wrap}button{border:1px solid #cbd4e0;background:#fff;border-radius:8px;padding:7px 11px;color:var(--ink);cursor:pointer}button.active{background:var(--navy);color:#fff;border-color:var(--navy)}#chart{height:500px;margin-top:12px}.events{display:grid;gap:8px;margin-top:14px}.event{border:1px solid var(--line);border-left:4px solid var(--blue);border-radius:9px;padding:12px;display:grid;grid-template-columns:150px 1fr repeat(3,120px);gap:10px;font-size:13px}.event span{color:var(--muted);font-size:11px;display:block}.footer{font-size:12px;color:var(--muted);padding:20px 0 40px;line-height:1.8}.footer a{color:inherit}.error{display:block;background:#fff8e7;border-color:#efd08a;color:#684900}@media(max-width:850px){.summary{grid-template-columns:repeat(2,1fr)}.signal{grid-column:1/-1}.event{grid-template-columns:1fr 1fr}.event>div:nth-child(2){grid-column:1/-1}#chart{height:420px}}@media(max-width:520px){.summary{gap:8px}.metric{padding:14px}.metric strong{font-size:17px}.panel{padding:10px}.event{grid-template-columns:1fr}.event>div:nth-child(2){grid-column:auto}#chart{height:360px}}
</style></head><body><header class="top"><div class="shell"><a class="back" href="./">← 開示イベント一覧</a><h1 id="title">銘柄詳細</h1><p class="sub" id="ticker">読み込み中</p></div></header><main class="shell main"><div id="notice" class="notice"></div><section id="summary" class="summary" hidden><div class="metric signal"><span>シグナルスコア</span><strong id="score">—</strong></div><div class="metric"><span>現在保有率</span><strong id="ratio">—</strong></div><div class="metric"><span>保有率変化</span><strong id="change">—</strong></div><div class="metric"><span>提出後5日</span><strong id="return">—</strong></div><div class="metric"><span>出来高倍率</span><strong id="volume">—</strong></div></section><section id="chartPanel" class="panel" hidden><div class="toolbar"><div class="buttons" id="modes"><button data-mode="candle" class="active">ローソク足</button><button data-mode="return">騰落率</button><button data-mode="market">市場比較</button></div><div class="buttons" id="periods"><button data-days="30">1M</button><button data-days="90">3M</button><button data-days="180">6M</button><button data-days="365" class="active">1Y</button><button data-days="0">ALL</button></div></div><div id="chart"></div><div id="events" class="events"></div></section></main><footer class="shell footer">開示情報：金融庁 EDINET　／　株価情報：Yahoo Finance / yfinance　／　チャート：<a href="https://www.tradingview.com/" rel="noopener noreferrer">TradingView Lightweight Charts</a><br>本ページは投資判断を推奨するものではありません。</footer><script>
const DATA='https://raw.githubusercontent.com/highwing-republic/stock/main/public/data/stocks';const code=new URLSearchParams(location.search).get('code');let payload,chart,mode='candle',days=365;const $=id=>document.getElementById(id),fmt=v=>v==null?'—':Number(v).toLocaleString('ja-JP',{maximumFractionDigits:2}),signed=(v,suffix='')=>v==null?'—':`${v>0?'+':''}${fmt(v)}${suffix}`,esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
function filtered(rows){if(!days)return rows;let end=new Date(rows.at(-1)?.trade_date||Date.now()),cut=new Date(end-days*864e5);return rows.filter(x=>new Date(x.trade_date)>=cut)}
function buildChart(){if(chart)chart.remove();let el=$('chart');chart=LightweightCharts.createChart(el,{width:el.clientWidth,height:el.clientHeight,layout:{background:{color:'#fff'},textColor:'#596579',attributionLogo:true},grid:{vertLines:{color:'#f0f2f5'},horzLines:{color:'#f0f2f5'}},timeScale:{borderColor:'#dfe4ea'},rightPriceScale:{borderColor:'#dfe4ea'}});let prices=filtered(payload.prices||[]);if(mode==='candle'){let candles=chart.addSeries(LightweightCharts.CandlestickSeries,{upColor:'#16805b',downColor:'#dc3545',wickUpColor:'#16805b',wickDownColor:'#dc3545',borderVisible:false});candles.setData(prices.map(x=>({time:x.trade_date,open:x.open,high:x.high,low:x.low,close:x.close})));let volume=chart.addSeries(LightweightCharts.HistogramSeries,{priceFormat:{type:'volume'},priceScaleId:'volume',color:'#9aacbf'});volume.priceScale().applyOptions({scaleMargins:{top:.8,bottom:0}});volume.setData(prices.map(x=>({time:x.trade_date,value:x.volume||0,color:x.close>=x.open?'rgba(22,128,91,.45)':'rgba(220,53,69,.4)'})));let markers=(payload.events||[]).filter(x=>prices.some(p=>p.trade_date===(x.submitDatetime||'').slice(0,10))).map(x=>({time:(x.submitDatetime||'').slice(0,10),position:'aboveBar',color:x.holdingChange<0?'#dc3545':'#2563eb',shape:x.holdingChange<0?'arrowDown':'arrowUp',text:x.reportType==='initial'?`新規 ${fmt(x.holdingRatio)}%`:`${signed(x.holdingChange,'pt')}`}));if(markers.length)LightweightCharts.createSeriesMarkers(candles,markers)}else{let base=prices[0]?.adj_close||prices[0]?.close;let stock=chart.addSeries(LightweightCharts.LineSeries,{color:'#2563eb',lineWidth:2,title:payload.company.name});stock.setData(prices.map(x=>({time:x.trade_date,value:mode==='return'?(x.adj_close/base-1)*100:(x.adj_close/base)*100})));if(mode==='market'){let bench=filtered(payload.benchmark||[]),bb=bench[0]?.adj_close;let b=chart.addSeries(LightweightCharts.LineSeries,{color:'#8b95a5',lineWidth:2,title:payload.benchmarkLabel});b.setData(bench.map(x=>({time:x.trade_date,value:(x.adj_close/bb)*100})))}}chart.timeScale().fitContent()}
function render(){let latest=payload.events[0]||{};$('title').textContent=`${payload.company.securityCode} ${payload.company.name}`;$('ticker').textContent=payload.company.ticker;$('score').textContent=fmt(latest.signalScore);$('ratio').textContent=latest.holdingRatio==null?'—':fmt(latest.holdingRatio)+'%';$('change').textContent=signed(latest.holdingChange,'pt');$('return').textContent=signed(latest.priceChange,'%');$('volume').textContent=latest.volumeRatio==null?'—':fmt(latest.volumeRatio)+'倍';$('summary').hidden=false;$('chartPanel').hidden=false;$('events').innerHTML=(payload.events||[]).map(x=>`<article class="event"><div><span>提出日時</span>${esc((x.submitDatetime||'').replace('T',' ').slice(0,16))}</div><div><span>提出者／保有目的</span><strong>${esc(x.filerName||'—')}</strong><br>${esc(x.purpose||'—')}</div><div><span>保有率</span>${fmt(x.previousHoldingRatio)} → ${fmt(x.holdingRatio)}%</div><div><span>増減</span>${signed(x.holdingChange,'pt')}</div><div><span>5日反応</span>${signed(x.priceChange,'%')}</div></article>`).join('');buildChart()}
async function load(){if(!code||!/^[0-9A-Za-z]{4}$/.test(code)){return fail('証券コードが正しくありません。')}try{let r=await fetch(`${DATA}/${encodeURIComponent(code)}.json?t=${Date.now()}`);if(!r.ok)throw Error(r.status);payload=await r.json();render()}catch(e){fail('この銘柄の詳細データはまだ生成されていません。初回同期後に再度お試しください。')}}function fail(message){let n=$('notice');n.className='notice error';n.textContent=message}
document.querySelectorAll('#modes button').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('#modes button').forEach(x=>x.classList.toggle('active',x===b));buildChart()});document.querySelectorAll('#periods button').forEach(b=>b.onclick=()=>{days=+b.dataset.days;document.querySelectorAll('#periods button').forEach(x=>x.classList.toggle('active',x===b));buildChart()});addEventListener('resize',()=>chart&&chart.applyOptions({width:$('chart').clientWidth}));load();
</script></body></html>
