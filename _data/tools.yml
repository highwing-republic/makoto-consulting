# 公開中ツールの一覧（唯一の台帳）。関連ツール表示（_includes/tool-related.html）が参照します。
# id は index.html の data-tool-id と同じ。pref: true のツールは ?pref=都道府県 を受け取れます。
- id: dx-diagnosis
  title: 旅館・ホテル DXかんたん診断
  url: /dx-diagnosis.html
  group: facility
  tag: 無料診断
  summary: 施設の現状から、DXで優先したいポイントを整理します。
- id: ai-inn-sample
  title: AIに聞かれる宿 診断 サンプル
  url: /ai-inn-diagnosis/sample/
  group: facility
  tag: サンプル（架空の宿）
  summary: 旅館のAIO対策を、対策前と対策後で比べたサンプル。旅館ならではの12の質問にAIが答えられた数は、4問から12問に増えました。
- id: inbound
  title: インバウンド宿泊者分析
  url: /inbound-analysis.html
  group: regional
  tag: 公的データ
  pref: true
  summary: 外国人宿泊需要や国・地域別構成を、都道府県ごとに分析します。
- id: dx-necessity
  title: 地域の省人化・DX検討指標
  url: /dx-necessity-analysis.html
  group: regional
  tag: 公的データ
  pref: true
  summary: 宿泊需要・人材負荷・人口から、地域のDX必要度を分析します。
- id: supply-demand
  title: 宿泊市場の成長・稼働ポジション
  url: /supply-demand-gap-analysis.html
  group: regional
  tag: 公的データ
  pref: true
  summary: 需要・稼働率・宿泊事業所数から、地域の需給状況を分析します。
- id: tourism-pressure
  title: 宿泊集中度・宿泊業依存度
  url: /tourism-pressure-analysis.html
  group: regional
  tag: 公的データ
  pref: true
  summary: 宿泊者数・人口・宿泊業従業者数から、地域の観光依存度を分析します。
- id: market-signal
  title: 観光株シグナル
  url: /report.html
  group: market
  tag: 市場の動き
  summary: 観光・インバウンド関連企業の動きから、市場変化の兆候を確認します。
- id: hotel-price-trends
  title: 宿泊料金トレンド
  url: /hotel-price-trends.html
  group: market
  tag: 市場の動き
  summary: 同じ宿泊条件で、地域や施設ごとの料金と取得日ごとの推移を比較します。
- id: business-hotel-price-trends
  title: ビジネスホテル料金トレンド
  url: /business-hotel-price-trends.html
  group: market
  tag: 市場の動き
  summary: 全国10都市のビジネスホテルの料金水準と値動きを、同じ条件で毎朝観測して比べます。
- id: management-issue-organizer
  title: 宿泊経営の課題整理（β）
  url: /management-ai.html
  group: experimental
  tag: 実験的ツール（ルールベース）
  pref: true
  summary: 地域データと施設情報から、DX・人手不足・市場環境を考えるヒントを提示します。
- id: mini-pms-demo
  title: 簡易PMSデモ（予約・部屋割り）
  url: /demo/mini-pms/
  group: experimental
  tag: 体験デモ（架空データ）
  summary: 架空ホテルで、予約登録から部屋割り・客室状況表までをブラウザで体験できます。
- id: booking-engine-demo
  title: 予約エンジンデモ（公式予約サイト）
  url: /demo/booking/
  group: experimental
  tag: 体験デモ（架空データ）
  summary: 架空ホテルの公式予約サイトで、空室検索から予約・キャンセルまでを体験できます。
- id: hotel-site-demo
  title: 多言語旅館サイトデモ
  url: /demo/hotel/
  group: experimental
  tag: 体験デモ（架空データ）
  summary: 架空の宿の公式サイトを日英中韓の4言語で体験できます。旅館のAIO対策を行った後のサイトです。
